<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex,nofollow"><title>Sujetica: two-file delivery test</title><style>body{font:17px system-ui;max-width:900px;margin:32px auto;padding:16px}button,select{font:inherit;padding:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Independent delivery: S and JS</h1><p>This test downloads two files without running the application. It checks complete size and SHA256, with a 45-second limit per file. Browser data is preserved.</p><select id="channel"><option value="">Select network</option><option>Home Wi-Fi</option><option>Phone hotspot / mobile data</option><option>Ethernet</option><option>Other / unknown</option></select> <label><input type="checkbox" id="confirmed">This is the affected laptop; network confirmed</label><p><button id="run">Test two files</button> <button id="save" disabled>Save JSON</button></p><pre id="out">Ready to start.</pre><p>Direct links: <a href="hero-850-ad2d893caba9e9c8.webp">S image</a> | <a href="index-B6hUNnYD.js">Main JS</a>. No need to open these separately after the test.</p><script>
const files=[{"name":"hero-850-ad2d893caba9e9c8.webp","source":"/sujetica-home/immutable/hero-850-ad2d893caba9e9c8.webp","bytes":64664,"sha256":"ad2d893caba9e9c8d47abc7dfa115a450065d114db013dfa2bf3fc89e28c875f"},{"name":"index-B6hUNnYD.js","source":"/_next/static/chunks/index-B6hUNnYD.js","bytes":210282,"sha256":"57fcfd7135390800ff83b06f00ded2ecb76222cca45c417ac7fdd77dbec7e234"}];let report;const out=document.querySelector('#out'),run=document.querySelector('#run'),save=document.querySelector('#save');run.onclick=async()=>{if(!document.querySelector('#channel').value||!document.querySelector('#confirmed').checked){out.textContent='Select and confirm your network.';return;}run.disabled=true;report={startedAtUtc:new Date().toISOString(),networkUserConfirmed:document.querySelector('#channel').value,affectedDeviceUserConfirmed:true,userAgent:navigator.userAgent,serviceWorkerControlled:!!navigator.serviceWorker?.controller,protocolForced:false,results:[]};try{for(const f of files){out.textContent='Downloading '+f.name;const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),45000),start=performance.now(),chunks=[];let size=0,status=null,ttfbMs=null,error=null,complete=false;try{const r=await fetch(f.name,{cache:'no-store',credentials:'omit',signal:ctrl.signal});status=r.status;ttfbMs=performance.now()-start;const reader=r.body.getReader();while(true){const p=await reader.read();if(p.done){complete=true;break;}chunks.push(p.value);size+=p.value.length;}}catch(e){error=e.name+': '+e.message;}finally{clearTimeout(timer);}const durationMs=performance.now()-start,b=new Uint8Array(size);let offset=0;for(const c of chunks){b.set(c,offset);offset+=c.length;}const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b))).map(n=>n.toString(16).padStart(2,'0')).join('');const t=performance.getEntriesByName(new URL(f.name,location.href).href).filter(e=>e.startTime>=start-1).pop();report.results.push({file:f.name,status,expectedBytes:f.bytes,receivedBytes:size,expectedSha256:f.sha256,sha256:hash,ttfbMs,durationMs,complete,error,protocol:t?.nextHopProtocol||'unknown',pass:status===200&&complete&&!error&&size===f.bytes&&hash===f.sha256});}report.finishedAtUtc=new Date().toISOString();}catch(e){report.toolError=e.name+': '+e.message;}out.textContent=JSON.stringify(report,null,2);save.disabled=false;};save.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='Sujetica-independent-delivery.json';a.click();};
</script></html>
